<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D2E0C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D2408;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Guitar body -->
  <ellipse cx="50" cy="70" rx="25" ry="20" fill="url(#bodyGrad)" />
  <ellipse cx="50" cy="70" rx="18" ry="12" fill="url(#bodyGrad)" />
  
  <!-- Sound hole -->
  <circle cx="50" cy="70" r="6" fill="#1a1008" />
  <circle cx="50" cy="70" r="4" fill="#000" />
  
  <!-- Bridge -->
  <rect x="40" y="82" width="20" height="4" rx="1" fill="#1a1008" />
  <rect x="43" y="82" width="3" height="8" fill="#8B4513" />
  <rect x="54" y="82" width="3" height="8" fill="#8B4513" />
  
  <!-- Neck -->
  <rect x="45" y="15" width="10" height="55" fill="url(#neckGrad)" />
  
  <!-- Headstock -->
  <polygon points="40,15 60,15 65,5 55,0 45,0 35,5" fill="url(#neckGrad)" />
  
  <!-- Tuning pegs -->
  <circle cx="38" cy="8" r="3" fill="#C0C0C0" />
  <circle cx="48" cy="4" r="3" fill="#C0C0C0" />
  <circle cx="58" cy="8" r="3" fill="#C0C0C0" />
  <circle cx="38" cy="12" r="3" fill="#C0C0C0" />
  <circle cx="48" cy="16" r="3" fill="#C0C0C0" />
  <circle cx="58" cy="12" r="3" fill="#C0C0C0" />
  
  <!-- Frets -->
  <line x1="45" y1="25" x2="55" y2="25" stroke="#C0C0C0" stroke-width="1.5" />
  <line x1="45" y1="32" x2="55" y2="32" stroke="#C0C0C0" stroke-width="1.5" />
  <line x1="45" y1="39" x2="55" y2="39" stroke="#C0C0C0" stroke-width="1.5" />
  <line x1="45" y1="46" x2="55" y2="46" stroke="#C0C0C0" stroke-width="1.5" />
  <line x1="45" y1="53" x2="55" y2="53" stroke="#C0C0C0" stroke-width="1.5" />
  <line x1="45" y1="60" x2="55" y2="60" stroke="#C0C0C0" stroke-width="1.5" />
  
  <!-- Strings -->
  <line x1="47" y1="5" x2="47" y2="88" stroke="#CCCCCC" stroke-width="0.8" />
  <line x1="49" y1="5" x2="49" y2="88" stroke="#AAAAAA" stroke-width="1" />
  <line x1="51" y1="5" x2="51" y2="88" stroke="#888888" stroke-width="1.2" />
  <line x1="53" y1="5" x2="53" y2="88" stroke="#666666" stroke-width="1.5" />
  
  <!-- Fret markers -->
  <circle cx="50" cy="28.5" r="1.5" fill="#FFD700" />
  <circle cx="50" cy="42.5" r="1.5" fill="#FFD700" />
  <circle cx="46" cy="56.5" r="1.5" fill="#FFD700" />
  <circle cx="54" cy="56.5" r="1.5" fill="#FFD700" />
</svg>